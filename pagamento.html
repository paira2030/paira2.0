
<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Estado do pagamento — Maelle</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #faf9f7;
      color: #222;
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border: 1px solid #ddd;
      padding: 36px;
      max-width: 490px;
      text-align: center;
    }
    a { color: #485a3e; }
  </style>
<script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-xcod-sck data-utmify-prevent-subids async defer></script>
</head>
<body>
  <main class="card">
    <h1>MAELLE</h1>
    <h2 id="status">A confirmar pagamento...</h2>
    <p id="details">
      Aguarde enquanto consultamos a SumUp.
    </p>
    <p><a href="/index.html">Voltar à loja</a></p>
  </main>

  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('pedido');
      const title = document.getElementById('status');
      const details = document.getElementById('details');

      if (!id || !/^[0-9a-f-]{36}$/i.test(id)) {
        title.textContent = 'Referência inválida';
        details.textContent = 'Não foi possível identificar a encomenda.';
        return;
      }

      for (let attempt = 0; attempt < 12; attempt++) {
        try {
          const r = await fetch(
            '/api/sumup-status?pedido=' + encodeURIComponent(id),
            { cache: 'no-store' }
          );

          const d = await r.json();

          if (!r.ok) {
            throw new Error(d.error || 'Falha na consulta');
          }

          if (d.status === 'PAID') {
            title.textContent = 'Pagamento confirmado';
            try{const k='maelle_px_done_'+id;if(window.fbq&&!localStorage.getItem(k)){const c=JSON.parse(sessionStorage.getItem('maelle_px_purchase')||'null');if(c&&c.pedido===id){fbq('track','Purchase',{value:Number(c.value)||0,currency:'EUR',content_ids:c.ids,content_type:'product',num_items:c.n},{eventID:id});localStorage.setItem(k,'1');}}}catch(e){}
            details.textContent =
              'A SumUp confirmou o pagamento. Obrigado pela sua encomenda!';
            if(d.codigo_rastreio){const p=document.createElement('p');p.textContent='Código de acompanhamento: '+d.codigo_rastreio;const a=document.createElement('a');a.href='/localizar.html';a.textContent=' Acompanhar encomenda';p.append(document.createElement('br'),a);details.after(p);}
            return;
          }

          if (d.status === 'FAILED' || d.status === 'EXPIRED') {
            title.textContent = 'Pagamento não concluído';
            details.textContent =
              'O pagamento falhou ou expirou. Volte à loja para tentar novamente.';
            return;
          }

          title.textContent = 'A aguardar confirmação';
          details.textContent =
            'Estamos a verificar o pagamento junto da SumUp.';

        } catch (e) {
          title.textContent = 'A verificar pagamento';
          details.textContent =
            'Não foi possível consultar agora. Vamos tentar novamente.';
        }

        if (attempt < 11) {
          await new Promise(resolve => setTimeout(resolve, 5000));
        }
      }

      title.textContent = 'Confirmação ainda pendente';
      details.textContent =
        'Não foi possível confirmar automaticamente. ' +
        'Volte a esta página mais tarde para consultar o estado.';
    })();
  </script>
<script>window.pixelId="6b0974075ed7f81dd7721aad";var a=document.createElement("script");a.setAttribute("async","");a.setAttribute("defer","");a.setAttribute("src","https://cdn.utmify.com.br/scripts/pixel/pixel.js");document.head.appendChild(a);</script>
</body>
</html>
