<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acessórios | MAELLE</title><link rel="icon" href="assets/images/branding/favicon.svg" type="image/svg+xml"><link rel="shortcut icon" href="assets/images/branding/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff;color:#171717;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px}.maelle-header{border-bottom:1px solid #e9e7e4;background:#fafafa;position:relative;z-index:10}.mh-inner{max-width:1440px;margin:auto;min-height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:26px}.maelle-header a{color:#171717;text-decoration:none}.mh-logo{font:normal 29px 'Cormorant Garamond',serif;letter-spacing:.16em;white-space:nowrap}.mh-nav{display:flex;align-items:center;justify-content:center;gap:clamp(13px,1.65vw,30px)}.mh-nav a{font-size:10px;letter-spacing:.065em;white-space:nowrap}.mh-nav a:hover{opacity:.6}.mh-nav a.sale{color:#b94a39}.mh-actions{display:flex;align-items:center;gap:14px}.mh-actions a,.mh-actions button,.mh-mobile-trigger{border:0;background:transparent;padding:4px;color:#171717;cursor:pointer;display:flex;align-items:center}.mh-mobile-trigger{display:none}#mh-search{padding:14px 5%;border-top:1px solid #eee}#mh-search label{font-size:11px;margin-right:14px}#mh-search input{padding:10px;border:1px solid #ddd;width:min(70%,500px)}[hidden]{display:none!important}@media(max-width:1200px){.mh-nav{gap:12px}.mh-inner{gap:16px}.mh-nav a{font-size:9px}}@media(max-width:1000px){.mh-mobile-trigger{display:flex}.mh-inner{justify-content:flex-start}.mh-logo{margin-right:auto}.mh-nav{display:none;position:absolute;top:64px;left:0;right:0;background:#fafafa;padding:20px;box-shadow:0 8px 14px #0001;flex-wrap:wrap;justify-content:flex-start}.mh-nav.mh-open{display:flex}.mh-actions{gap:10px}}@media(max-width:480px){.mh-inner{padding:0 15px;gap:10px}.mh-logo{font-size:25px}.mh-actions{gap:5px}.mh-actions svg{width:18px;height:18px}}.wrap{max-width:1350px;margin:0 auto;padding:34px 22px}h1{font:normal 48px 'Cormorant Garamond',serif;margin:0}.intro{line-height:1.8;color:#666;max-width:690px}.toolbar{border-top:1px solid #ddd;border-bottom:1px solid #ddd;margin:30px 0;padding:14px 0;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:35px}.filters label{display:block;margin:10px 0}.filters h3{font-size:11px;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.item img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f4f4f2}.item a{color:inherit;text-decoration:none}.item p{line-height:1.55;margin:7px 0}.old{color:#888;text-decoration:line-through;font-size:11px;margin-left:8px}.badge{color:#a43d30;font-size:11px}select,input{accent-color:#333}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.layout{grid-template-columns:1fr}.filters{display:flex;flex-wrap:wrap;gap:14px}.filters h3{width:100%;margin:0}.filters label{margin:0}h1{font-size:40px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:25px 15px}}</style><link rel="stylesheet" href="assets/css/black-friday.css"></head><body><header class="maelle-header"><div class="mh-inner"><button class="mh-mobile-trigger" aria-label="Abrir menu" type="button" onclick="document.querySelector('.mh-nav').classList.toggle('mh-open')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a href="index.html" class="mh-logo" aria-label="Maelle início">MAELLE</a><nav class="mh-nav" aria-label="Departamentos"><a href="inverno.html" class="">INVERNO</a><a href="index.html?categoria=verao" class="" >VERÃO</a><a href="index.html?categoria=novidades" class="" >NOVIDADES</a><a href="index.html?categoria=vestidos" class="" >VESTIDOS</a><a href="index.html?categoria=tops" class="" >ROUPA</a><a href="index.html?categoria=casacos" class="" >CASACOS</a><a href="index.html?categoria=conjuntos" class="" >CONJUNTOS</a><a href="acessorios.html" aria-current="page" class="" >ACESSÓRIOS</a><a href="saldos.html" class="sale">SALDOS</a></nav><div class="mh-actions"><button type="button" aria-label="Pesquisar produtos" onclick="document.getElementById('mh-search').hidden=!document.getElementById('mh-search').hidden;document.getElementById('mh-search-input').focus()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button><a href="admin.html" aria-label="Minha conta" title="Minha conta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a><a href="index.html" aria-label="Favoritos" title="Favoritos na loja"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></a><a href="index.html" aria-label="Carrinho" title="Carrinho na loja"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></a></div></div><div id="mh-search" hidden><label for="mh-search-input">Pesquisar nesta coleção</label><input id="mh-search-input" type="search" placeholder="Pesquisar peças..." oninput="window.maelleCategorySearch=this.value.toLocaleLowerCase('pt-PT');draw()"></div></header><main class="wrap"><h1>Acessórios</h1><p id="count" style="color:#666">A carregar artigos...</p><p class="intro">Descubra os acessórios Maelle para completar o seu look.</p><div class="toolbar"><span>FILTRAR</span><label>Ordenar <select id="sort"><option value="relevance">Relevância</option><option value="low">Preço: menor primeiro</option><option value="high">Preço: maior primeiro</option><option value="new">Novidades</option></select></label></div><div class="layout"><aside class="filters"><h3>POR TIPO</h3><div id="cats"></div><h3>POR PREÇO</h3><select id="price"><option value="">Todos os preços</option><option value="40">Até 40 €</option><option value="50">Até 50 €</option><option value="70">Até 70 €</option></select><label><input id="discount" type="checkbox"> Em saldo (-50%)</label><button type="button" id="clear">Limpar filtros</button><div id="sizes" hidden></div></aside><section id="grid" class="grid" aria-live="polite"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/supabase-config.js"></script><script src="js/supabase-bridge.js"></script><script src="assets/js/black-friday.js?v=bf1"></script><script src="assets/js/categories.js"></script><script>const type='acessorios';const params=new URLSearchParams(location.search);let products=[];const cat=document.getElementById('cats'),sz=document.getElementById('sizes');const money=n=>Number(n).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function restoreCollection(){const state=history.state?.maelleCollection;if(!state)return;for(const [el,values] of [[cat,state.cats],[sz,state.sizes]])el.querySelectorAll('input').forEach(e=>e.checked=values.includes(e.value));for(const id of ['sort','price','discount']){const e=document.getElementById(id);if(e&&state[id]!==undefined){if(e.type==='checkbox')e.checked=state[id];else e.value=state[id];}}const search=document.getElementById('mh-search-input');if(search){search.value=state.search||'';window.maelleCategorySearch=search.value.toLocaleLowerCase('pt-PT');if(search.value)document.getElementById('mh-search').hidden=false;}requestAnimationFrame(()=>window.scrollTo(0,state.scroll||0));}document.getElementById('grid').addEventListener('click',e=>{if(!e.target.closest('a'))return;const state={cats:[...cat.querySelectorAll('input:checked')].map(e=>e.value),sizes:[...sz.querySelectorAll('input:checked')].map(e=>e.value),search:document.getElementById('mh-search-input')?.value||'',scroll:window.scrollY};for(const id of ['sort','price','discount']){const el=document.getElementById(id);if(el)state[id]=el.type==='checkbox'?el.checked:el.value;}history.replaceState({...history.state,maelleCollection:state},'');});function draw(){const chosenCats=[...cat.querySelectorAll('input:checked')].map(e=>e.value),chosenSizes=[...sz.querySelectorAll('input:checked')].map(e=>e.value);let arr=products.filter(p=>(!window.maelleCategorySearch||String(p.title||'').toLocaleLowerCase('pt-PT').includes(window.maelleCategorySearch))&&(!chosenCats.length||chosenCats.some(k=>MaelleCategories.match(p,"acessorios",k)))&&(!chosenSizes.length||chosenSizes.some(s=>(p.sizes||[]).includes(s))));const max=Number(document.getElementById('price').value);if(max)arr=arr.filter(p=>MaelleBlackFriday.price(p)<=max);if(document.getElementById('discount').checked)arr=arr.filter(p=>p.isSaldo&&p.oldPrice>0&&MaelleBlackFriday.price(p)<=p.oldPrice/2);const sort=document.getElementById('sort').value;if(sort==='low')arr.sort((a,b)=>window.MaelleBlackFriday.price(a)-window.MaelleBlackFriday.price(b));if(sort==='high')arr.sort((a,b)=>window.MaelleBlackFriday.price(b)-window.MaelleBlackFriday.price(a));if(sort==='new')arr.reverse();document.getElementById('count').textContent=arr.length+' artigos';document.getElementById('grid').innerHTML=arr.length?arr.map(p=>`<article class="item"><a href="index.html?produto=${encodeURIComponent(p.id)}"><img loading="lazy" src="${escapeHtml(p.localImage||p.images?.[0]||'')}" alt="${escapeHtml(p.title)}"><p>${escapeHtml(p.title)}</p><strong>${money(window.MaelleBlackFriday.price(p))}</strong>${window.MaelleBlackFriday.eligible(p)?`<span class="old">${money(p.price)}</span> <span class="maelle-bf-tag">BLACK FRIDAY −20%</span>`:p.oldPrice>p.price?`<span class="old">${money(p.oldPrice)}</span> <span class="badge">-${Math.round((1-p.price/p.oldPrice)*100)}%</span>`:''}</a></article>`).join(''):'<p>Nenhum artigo nesta seleção.</p>';}function filters(el,values){el.innerHTML=values.map(v=>`<label><input type="checkbox" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join('');el.addEventListener('change',draw);}async function init(){try{await window.MaelleBlackFriday.load();if(MaelleDB.enabled)products=await MaelleDB.list(true);else{const r=await fetch('data/products.json');products=await r.json();}products=products.filter(p=>MaelleCategories.parent(p.category)==='acessorios');filters(cat,Object.keys(MaelleCategories.groups.acessorios));cat.querySelectorAll('input').forEach(e=>{e.parentNode.lastChild.textContent=' '+MaelleCategories.groups.acessorios[e.value];e.checked=params.get('tipo')===e.value||(params.get('tipo')==='malas'&&['mala','carteira'].includes(e.value));});document.getElementById('price').value=params.get('preco')||'';document.getElementById('discount').checked=params.get('desconto')==='50';restoreCollection();draw();}catch(e){console.error(e);document.getElementById('count').textContent='Não foi possível carregar os produtos.';}}document.getElementById('sort').addEventListener('change',draw);['price','discount'].forEach(id=>document.getElementById(id).addEventListener('change',draw));document.getElementById('clear').onclick=()=>{cat.querySelectorAll('input').forEach(e=>e.checked=false);document.getElementById('price').value='';document.getElementById('discount').checked=false;draw();};init();</script></body></html>
