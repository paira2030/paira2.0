<!DOCTYPE html><html lang="pt-PT"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inverno | MAELLE</title><link rel="stylesheet" href="assets/css/style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff;color:#171717;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px}header{border-bottom:1px solid #eee;padding:22px max(5%,20px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header a{color:#222;text-decoration:none;font-size:11px;letter-spacing:.1em}.wrap{max-width:1350px;margin:0 auto;padding:34px 22px}h1{font:normal 48px 'Cormorant Garamond',serif;margin:0}.intro{line-height:1.8;color:#666;max-width:690px}.toolbar{border-top:1px solid #ddd;border-bottom:1px solid #ddd;margin:30px 0;padding:14px 0;display:flex;justify-content:space-between;align-items:center}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:35px}.filters label{display:block;margin:10px 0}.filters h3{font-size:11px;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.item img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#f4f4f2}.item a{color:inherit;text-decoration:none}.item p{line-height:1.55;margin:7px 0}.old{color:#888;text-decoration:line-through;font-size:11px;margin-left:8px}.badge{color:#a43d30;font-size:11px}select,input{accent-color:#333}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.layout{grid-template-columns:1fr}.filters{display:flex;flex-wrap:wrap;gap:14px}.filters h3{width:100%;margin:0}.filters label{margin:0}h1{font-size:40px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:25px 15px}}</style></head><body><header><a href="index.html" style="font:normal 28px 'Cormorant Garamond',serif;letter-spacing:.15em">MAELLE</a><nav style="display:flex;gap:16px;flex-wrap:wrap"><a href="inverno.html">INVERNO</a><a href="index.html">VERÃO</a><a href="index.html">NOVIDADES</a><a href="saldos.html">SALDOS</a></nav></header><main class="wrap"><h1>Inverno</h1><p id="count" style="color:#666">A carregar artigos...</p><p class="intro">Descubra a seleção Maelle para os dias mais frios, com peças de inverno escolhidas para si.</p><div class="toolbar"><span>FILTRAR</span><label>Ordenar <select id="sort"><option value="relevance">Relevância</option><option value="low">Preço: menor primeiro</option><option value="high">Preço: maior primeiro</option><option value="new">Novidades</option></select></label></div><div class="layout"><aside class="filters"><h3>COLEÇÃO</h3><div id="cats"></div><h3>TAMANHO</h3><div id="sizes"></div></aside><section id="grid" class="grid" aria-live="polite"></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/supabase-config.js"></script><script src="js/supabase-bridge.js"></script><script>const type='inverno';let products=[];const cat=document.getElementById('cats'),sz=document.getElementById('sizes');const money=n=>Number(n).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const chosenCats=[...cat.querySelectorAll('input:checked')].map(e=>e.value),chosenSizes=[...sz.querySelectorAll('input:checked')].map(e=>e.value);let arr=products.filter(p=>(!chosenCats.length||chosenCats.includes(p.category))&&(!chosenSizes.length||chosenSizes.some(s=>(p.sizes||[]).includes(s))));const sort=document.getElementById('sort').value;if(sort==='low')arr.sort((a,b)=>a.price-b.price);if(sort==='high')arr.sort((a,b)=>b.price-a.price);if(sort==='new')arr.reverse();document.getElementById('count').textContent=arr.length+' artigos';document.getElementById('grid').innerHTML=arr.length?arr.map(p=>`<article class="item"><a href="index.html?produto=${encodeURIComponent(p.id)}"><img loading="lazy" src="${escapeHtml(p.localImage||p.images?.[0]||'')}" alt="${escapeHtml(p.title)}"><p>${escapeHtml(p.title)}</p><strong>${money(p.price)}</strong>${p.oldPrice>p.price?`<span class="old">${money(p.oldPrice)}</span> <span class="badge">-${Math.round((1-p.price/p.oldPrice)*100)}%</span>`:''}</a></article>`).join(''):'<p>Nenhum artigo nesta seleção.</p>';}function filters(el,values){el.innerHTML=values.map(v=>`<label><input type="checkbox" value="${escapeHtml(v)}"> ${escapeHtml(v)}</label>`).join('');el.addEventListener('change',draw);}async function init(){try{if(MaelleDB.enabled)products=await MaelleDB.list();else{const r=await fetch('data/products.json');products=await r.json();}products=products.filter(p=>type==='saldos'?p.isSaldo&&Number(p.oldPrice)>Number(p.price):p.isInverno);filters(cat,[...new Set(products.map(p=>p.category).filter(Boolean))]);filters(sz,[...new Set(products.flatMap(p=>p.sizes||[]))]);draw();}catch(e){console.error(e);document.getElementById('count').textContent='Não foi possível carregar os produtos.';}}document.getElementById('sort').addEventListener('change',draw);init();</script></body></html>
