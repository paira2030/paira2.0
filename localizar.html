</head><body><header><a href="index.html">MAELLE</a></header><main><h1>Localizar encomenda</h1><p>Consulte o estado da sua encomenda utilizando o código apresentado após a confirmação do pagamento e o e-mail utilizado na compra.</p><form id="form"><label for="code">Código de acompanhamento</label><input id="code" required placeholder="MAE-..." maxlength="22" autocomplete="off"><label for="email">E-mail da encomenda</label><input id="email" required type="email" autocomplete="email"><button>Localizar</button></form><div id="result" role="status" aria-live="polite"></div><p><a href="index.html">Voltar à loja</a></p></main><script>const labels={processando:'Pagamento confirmado — encomenda recebida',preparando:'Encomenda em preparação',despachado:'Encomenda enviada',saiu_entrega:'Saiu para entrega',entregue:'Encomenda entregue'};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=document.getElementById('result');result.textContent='A consultar...';try{const r=await fetch('/api/localizar-encomenda',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:document.getElementById('code').value,email:document.getElementById('email').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha na consulta');result.textContent='Estado da encomenda: '+(labels[d.estado_entrega]||'Em processamento')}catch(err){result.textContent=err.message}});</script><script>window.pixelId="6b0974075ed7f81dd7721aad";var a=document.createElement("script");a.setAttribute("async","");a.setAttribute("defer","");a.setAttribute("src","https://cdn.utmify.com.br/scripts/pixel/pixel.js");document.head.appendChild(a);</script>
